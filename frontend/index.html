<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sagoton — Trading Signal Platform</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">SG</div>
      <div>
        <div class="brand-title">SAGOTON</div>
        <div class="brand-sub">Trading Signal Platform</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="badge" id="risk-badge"><span class="badge-dot dot-gray"></span>MARKET: —</span>
      <span class="badge" id="news-badge"><span class="badge-dot dot-gray"></span>NEWS: —</span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="scanner">Scanner</button>
    <button class="tab-btn" data-tab="journal">Journal</button>
    <button class="tab-btn" data-tab="performance">Performance</button>
    <button class="tab-btn" data-tab="backtest">Backtest</button>
  </nav>

  <!-- SCANNER -->
  <section class="panel active" id="panel-scanner">
    <div class="scan-controls">
      <div>
        <button class="btn" id="btn-scan">Run Scan</button>
        <button class="btn secondary" id="btn-paper-update">Update Paper Trades</button>
      </div>
      <div class="scan-meta" id="scan-meta">No scan run yet this session.</div>
    </div>
    <div id="scanner-results"></div>
  </section>

  <!-- JOURNAL -->
  <section class="panel" id="panel-journal">
    <div class="scan-controls">
      <h2 class="section-title" style="margin:0;">Trade Journal</h2>
      <button class="btn secondary" id="btn-refresh-journal">Refresh</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="journal-table">
        <thead>
          <tr>
            <th>Time</th><th>Symbol</th><th>Dir</th><th>Strategy</th><th>Entry</th><th>Target</th>
            <th>Stop</th><th>Score</th><th>Regime</th><th>Result</th><th>MFE%</th><th>MAE%</th><th>Holding</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- PERFORMANCE -->
  <section class="panel" id="panel-performance">
    <div class="scan-controls">
      <h2 class="section-title" style="margin:0;">Performance</h2>
      <button class="btn secondary" id="btn-refresh-performance">Refresh</button>
    </div>
    <div id="performance-content"></div>
  </section>

  <!-- BACKTEST -->
  <section class="panel" id="panel-backtest">
    <h2 class="section-title">Run a Backtest</h2>
    <div class="form-row">
      <select id="bt-symbol"></select>
      <select id="bt-strategy">
        <option value="breakout">Breakout</option>
        <option value="momentum">Momentum</option>
        <option value="reversal">Reversal</option>
      </select>
      <select id="bt-interval">
        <option value="15m">15m</option>
        <option value="1h" selected>1h</option>
        <option value="4h">4h</option>
        <option value="1d">1d</option>
      </select>
      <input type="number" id="bt-limit" value="1000" min="210" max="1000" style="width:90px;" />
      <button class="btn" id="btn-run-backtest">Run Backtest</button>
    </div>
    <div id="backtest-results"></div>

    <h2 class="section-title" style="margin-top:30px;">Saved Backtest Runs</h2>
    <div class="table-wrap">
      <table class="data-table" id="backtest-runs-table">
        <thead><tr><th>Run</th><th>Symbol</th><th>Strategy</th><th>Interval</th><th>Period</th><th>Reliable</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
