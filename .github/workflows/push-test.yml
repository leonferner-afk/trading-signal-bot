name: Test app notification

# Manual: sends one test notification to the home-screen app (secret WEB_PUSH).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        env:
          PYTHONPATH: .
          DB_PATH: /tmp/push.db
          WEB_PUSH: ${{ secrets.WEB_PUSH }}
        run: python -m app.cli push-test
