name: Strategy research

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of daily history
        default: "10"
      symbols:
        description: Comma-separated symbols (empty = full universe)
        default: ""
  schedule:
    # Sundays 08:17 UTC — refresh the evidence weekly with the latest data.
    - cron: "17 8 * * 0"

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run research
        env:
          PYTHONPATH: .
          DB_PATH: /tmp/research.db
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python -m app.cli research --years "${{ inputs.years || '10' }}" --symbols "${{ inputs.symbols }}" --out research_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-output
          path: backend/research_output/
          retention-days: 30
