name: Bot candidates research

# Manual: backtests the whole-market ETF "bots" (app/bot_research.py) and
# shows the report in the run summary. Read-only — changes nothing the
# daily bot uses.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Backtest the candidates
        working-directory: backend
        env:
          PYTHONPATH: .
          DB_PATH: /tmp/bots.db
        run: python -m app.cli bots --out "$GITHUB_WORKSPACE/bots.md"
      - uses: actions/upload-artifact@v4
        with:
          name: bots-report
          path: bots.md
          retention-days: 30
