name: Daily scan

on:
  schedule:
    # 05:37 UTC Tuesday–Saturday: after every US session has closed and its
    # daily bar is final; results are waiting when Sweden wakes up.
    - cron: "37 5 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: real data and the real journal (copied), but no notifications and nothing saved"
        type: boolean
        default: false
      fresh_journal:
        description: "Dry run only: start from an empty journal (exercises a full decision day)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: bot-state
          path: state
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Copy the journal for a dry run
        if: inputs.dry_run && !inputs.fresh_journal
        run: cp state/tradingbot.db /tmp/dry.db 2>/dev/null || true
      - name: Scan, update positions, report, notify
        working-directory: backend
        env:
          PYTHONPATH: .
          DB_PATH: ${{ inputs.dry_run && '/tmp/dry.db' || format('{0}/state/tradingbot.db', github.workspace) }}
          EVIDENCE_PATH: ${{ github.workspace }}/state/evidence.json
          # A dry run gets no delivery credentials, so nothing can be sent.
          GITHUB_TOKEN: ${{ !inputs.dry_run && github.token || '' }}
          TELEGRAM_BOT_TOKEN: ${{ !inputs.dry_run && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ !inputs.dry_run && secrets.TELEGRAM_CHAT_ID || '' }}
          REPORT_DIR: ${{ inputs.dry_run && '/tmp/reports' || format('{0}/state/reports', github.workspace) }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PORTFOLIO_SIZE_USD: ${{ vars.PORTFOLIO_SIZE_USD }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          MAX_NEW_BUYS_PER_DAY: ${{ vars.MAX_NEW_BUYS_PER_DAY }}
          MAX_POSITION_PCT: ${{ vars.MAX_POSITION_PCT }}
          POLICY_MODE: ${{ vars.POLICY_MODE }}
          ROTATION_UNIVERSE: ${{ vars.ROTATION_UNIVERSE }}
          ROTATION_MAX_POSITIONS: ${{ vars.ROTATION_MAX_POSITIONS }}
          ROTATION_EXIT_RS: ${{ vars.ROTATION_EXIT_RS }}
          ROTATION_REGIME_EXIT: ${{ vars.ROTATION_REGIME_EXIT }}
          ROTATION_STOP_PCT: ${{ vars.ROTATION_STOP_PCT }}
          ROTATION_MOMENTUM: ${{ vars.ROTATION_MOMENTUM }}
          ROTATION_REBALANCE: ${{ vars.ROTATION_REBALANCE }}
          ROTATION_MA50_EXIT: ${{ vars.ROTATION_MA50_EXIT }}
          ROTATION_MA50_AFTER_EXTENSION: ${{ vars.ROTATION_MA50_AFTER_EXTENSION }}
          # The rotation's own paper portfolio: 100 % (signals only since
          # 2026-11-03 — the owner's kronor depot holds Nasdaq 100 instead).
          BOT_SHARE_PCT: ${{ vars.BOT_SHARE_PCT || '100' }}
          ROCKETS_MODE: ${{ vars.ROCKETS_MODE }}
          # Lekpott off (owner's choice 2026-11-01): earnings rockets are
          # followed on paper only until they've proven something. Rockets
          # bought while it was on still get their sell alerts.
          ROCKET_POT_PCT: ${{ vars.ROCKET_POT_PCT || '0' }}
          ROCKET_POT_PAUSE_PCT: ${{ vars.ROCKET_POT_PAUSE_PCT || '30' }}
          FEE_BPS: ${{ vars.FEE_BPS }}
        run: python -m app.cli daily --report-dir "$REPORT_DIR"
      - name: Compute the hypothetical SEK tracker
        # Informational only (no real money): what a fixed kronor stake in
        # the live rotation would be worth today. Reads the journal the
        # real run just updated, so it's always in sync with it.
        if: always() && !inputs.dry_run
        working-directory: backend
        env:
          PYTHONPATH: .
          DB_PATH: ${{ github.workspace }}/state/tradingbot.db
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          HYPOTHETICAL_BASE_SEK: ${{ vars.HYPOTHETICAL_BASE_SEK }}
          # 10 000 kr from the 2026-11-02 close. Owner's choice 2026-11-03: the
          # depot is 100 % Nasdaq 100 (QQQ) — the highest return and the winner
          # under the pre-registered rule in the bot-candidate backtest
          # (app/bot_research.py, 2008-2026). The stock rotation keeps sending
          # its paper signals but no longer drives the depot. S&P 500 stays
          # the comparison. (Before: 25/75 from 10-30 ended at 9 862 kr.)
          HYPOTHETICAL_SINCE: ${{ vars.HYPOTHETICAL_SINCE || '2026-11-02T21:00:00+00:00' }}
          HYPOTHETICAL_FUND: ${{ vars.HYPOTHETICAL_FUND || 'QQQ' }}
          HYPOTHETICAL_FUND_PCT: ${{ vars.HYPOTHETICAL_FUND_PCT || '100' }}
          BOT_SHARE_PCT: ${{ vars.BOT_SHARE_PCT || '100' }}
          ROCKET_POT_PCT: ${{ vars.ROCKET_POT_PCT || '0' }}
          # The owner's kronor message (buys, sells, depot value) — once per new trading day.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m app.cli hypothetical --base-sek "${HYPOTHETICAL_BASE_SEK:-10000}" --since "$HYPOTHETICAL_SINCE"
          --out "$GITHUB_WORKSPACE/state/hypothetical.json" --notify-marker "$GITHUB_WORKSPACE/state/depot_notified.txt"
      - name: Build the status page
        # Public page (GitHub Pages) with the tracker, its history and the
        # day's report — built from the files above, published by `pages`.
        if: always() && !inputs.dry_run
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m app.cli dashboard --state "$GITHUB_WORKSPACE/state" --out "$GITHUB_WORKSPACE/state/site"
      - name: Save journal and reports
        if: always() && !inputs.dry_run
        working-directory: state
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Daily run $(date -u +%F)"
          git push -q origin HEAD:bot-state
      - name: Alert if the run crashed
        # The bot reports data problems itself; this catches a crash before
        # any report was written, so a silent day never looks like "no trades".
        if: failure() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f "state/reports/$(date -u +%F).md" ]; then exit 0; fi
          title="⚠ Tradingbot $(date -u +%F): körningen kraschade — inga signaler idag"
          body="Den dagliga körningen avbröts innan någon rapport skrevs. Öppna positioner bevakas igen vid nästa körning. Logg: $RUN_URL"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER" \
            || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
      - name: Keep the schedules alive
        # GitHub disables scheduled workflows in public repositories after 60
        # days without repository activity. Re-enabling them every run keeps
        # the bot running indefinitely (a no-op while they're enabled).
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in daily.yml research.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" || echo "could not re-enable $wf"
          done

  pages:
    # Publishes state/site to https://<owner>.github.io/<repo>/. Needs GitHub
    # Pages switched on once (Settings → Pages → Source: GitHub Actions);
    # until then this job fails without affecting the daily run.
    needs: daily
    if: always() && !inputs.dry_run && needs.daily.result != 'cancelled'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: bot-state
          path: state
      - uses: actions/upload-pages-artifact@v3
        with:
          path: state/site
      - id: deploy
        uses: actions/deploy-pages@v4
