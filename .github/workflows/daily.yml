name: Daily scan

on:
  schedule:
    # 05:37 UTC Tuesday–Saturday: after every US session has closed and its
    # daily bar is final; results are waiting when Sweden wakes up.
    - cron: "37 5 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: bot-state
          path: state
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Scan, update positions, report, notify
        working-directory: backend
        env:
          PYTHONPATH: .
          DB_PATH: ${{ github.workspace }}/state/tradingbot.db
          EVIDENCE_PATH: ${{ github.workspace }}/state/evidence.json
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          PORTFOLIO_SIZE_USD: ${{ vars.PORTFOLIO_SIZE_USD }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT }}
          MAX_OPEN_POSITIONS: ${{ vars.MAX_OPEN_POSITIONS }}
          MAX_NEW_BUYS_PER_DAY: ${{ vars.MAX_NEW_BUYS_PER_DAY }}
        run: python -m app.cli daily --report-dir "$GITHUB_WORKSPACE/state/reports"
      - name: Save journal and reports
        if: always()
        working-directory: state
        run: |
          git config user.name "tradingbot"
          git config user.email "tradingbot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "Daily run $(date -u +%F)"
          git push -q origin HEAD:bot-state
